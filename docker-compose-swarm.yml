version: '3.8'

networks:
  library-network:
    driver: overlay
services:
  db:
    image: postgres:17.0
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: librarian
      POSTGRES_PASSWORD: 17283940
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - library-network

  nginx:
    image: nginx:1.29.3-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles:ro
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - library-network

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - library-network

  web:
    image: vladazh/library-app:1.0.4
    command: 
      sh -c "
      sleep 15 &&
      python /app/manage.py runserver 0.0.0.0:8000 "
    working_dir: /app
    ports:
    - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://librarian:17283940@db:5432/library_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - static_volume:/app/staticfiles
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    networks:
      - library-network

  celery_worker:
    image: vladazh/library-app:1.0.4
    command: celery -A library worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://librarian:17283940@db:5432/library_db
      - REDIS_URL=redis://redis:6379/0
      - CACHE_URL=redis://redis:6379/1
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - library-network

volumes:
  postgres_data:
    external: true
    name: kurs_postgres_data
  redis_data:
    external: true  
    name: kurs_redis_data
  static_volume:
    external: true
    name: kurs_static_volume