name: Django Library CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: library-app

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.0
        env:
          POSTGRES_DB: library_db
          POSTGRES_USER: librarian
          POSTGRES_PASSWORD: 17283940
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django coverage

    - name: Run migrations
      run: |
        cd library
        python manage.py migrate
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: library_db
        DB_USER: librarian
        DB_PASSWORD: 17283940
        REDIS_URL: redis://localhost:6379/0
        DEBUG: 'True'

    - name: Run tests
      run: |
        cd library
        python manage.py test --noinput
        coverage run --source='.' manage.py test
        coverage report
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: library_db
        DB_USER: librarian
        DB_PASSWORD: 17283940
        REDIS_URL: redis://localhost:6379/0
        DEBUG: 'True'
        SECRET_KEY: test-secret-key

    - name: Run security check
      run: |
        pip install bandit
        bandit -r library/ -f txt || true

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install Docker Compose
      run: |
        # Устанавливаем Docker Compose через официальный скрипт
        sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ${{ env.DOCKER_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker Compose
      run: |
        # Создаем тестовый docker-compose для CI с правильными настройками
        cat > docker-compose.ci.yml << 'EOF'
        version: '3.8'

        services:
          db:
            image: postgres:17.0
            environment:
              POSTGRES_DB: library_db
              POSTGRES_USER: librarian
              POSTGRES_PASSWORD: 17283940
            networks:
              - library-network

          web:
            build: .
            ports:
              - "8000:8000"
            environment:
              DB_HOST: db
              DB_NAME: library_db
              DB_USER: librarian
              DB_PASSWORD: 17283940
              DB_PORT: 5432
              PORT: 8000
              REDIS_URL: redis://redis:6379/0
            depends_on:
              - db
              - redis
            networks:
              - library-network
            command: >
              sh -c "
              sleep 10
              python manage.py migrate --noinput
              python manage.py collectstatic --noinput
              gunicorn --bind 0.0.0.0:8000 --workers 3 library.wsgi:application"

          redis:
            image: redis:7.2-alpine
            networks:
              - library-network

        networks:
          library-network:
            driver: bridge
        EOF
        
        docker-compose -f docker-compose.ci.yml up --build -d
        sleep 30
        docker-compose -f docker-compose.ci.yml ps
        docker-compose -f docker-compose.ci.yml logs web
        curl -f http://localhost:8000/ || echo "Service check completed"
        docker-compose -f docker-compose.ci.yml down

  integration-test:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Docker Compose
      run: |
        # Устанавливаем Docker Compose через официальный скрипт
        sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: Create volumes
      run: |
        docker volume create postgres_data || true
        docker volume create redis_data || true

    - name: Deploy full stack
      run: |
        # Используем модифицированный docker-compose для CI
        cat > docker-compose.ci.yml << 'EOF'
        version: '3.8'

        services:
          db:
            image: postgres:17.0
            environment:
              POSTGRES_DB: library_db
              POSTGRES_USER: librarian
              POSTGRES_PASSWORD: 17283940
            networks:
              - library-network

          web:
            build: .
            ports:
              - "8000:8000"
            environment:
              DB_HOST: db
              DB_NAME: library_db
              DB_USER: librarian
              DB_PASSWORD: 17283940
              DB_PORT: 5432
              PORT: 8000
              REDIS_URL: redis://redis:6379/0
            depends_on:
              - db
              - redis
            networks:
              - library-network
            command: >
              sh -c "
              sleep 10
              python manage.py migrate --noinput
              python manage.py collectstatic --noinput
              gunicorn --bind 0.0.0.0:8000 --workers 3 library.wsgi:application"

          redis:
            image: redis:7.2-alpine
            networks:
              - library-network

        networks:
          library-network:
            driver: bridge
        EOF
        
        docker-compose -f docker-compose.ci.yml up --build -d
        
        # Wait for services to be ready
        sleep 30
        
        # Check service status
        docker-compose -f docker-compose.ci.yml ps
        
        # Test web service
        timeout 60s bash -c 'until curl -f http://localhost:8000; do sleep 5; done' || true
        
        # Test database connection
        docker-compose -f docker-compose.ci.yml exec -T db pg_isready -U librarian
        
        # Test Redis connection
        docker-compose -f docker-compose.ci.yml exec -T redis redis-cli ping

    - name: Cleanup
      if: always()
      run: |
        docker-compose -f docker-compose.ci.yml down -v
        docker system prune -f

  upload-artifacts:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4

    - name: Upload deployment files
      uses: actions/upload-artifact@v4
      with:
        name: deployment-files
        path: |
          docker-compose.yml
          docker-compose-swarm.yml
          requirements.txt
          library/
        retention-days: 30

    - name: Upload deploy script
      run: |
        # Create deploy script
        cat > deploy.sh << 'EOF'
        #!/bin/bash
        echo "Deploying Library Application..."
        
        # Create volumes if they don't exist
        docker volume create postgres_data || true
        docker volume create redis_data || true
        
        # Build and start services
        docker-compose up --build -d
        
        # Wait for services to start
        sleep 30
        
        # Run migrations
        docker-compose exec -T web python manage.py migrate --noinput
        docker-compose exec -T web python manage.py collectstatic --noinput
        
        echo "Deployment completed! Access the application at http://localhost:8000"
        EOF
        
        chmod +x deploy.sh

    - name: Upload deploy script as artifact
      uses: actions/upload-artifact@v4
      with:
        name: deploy-script
        path: deploy.sh
        retention-days: 30