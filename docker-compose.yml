services:
  db:
    image: postgres:17.0
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: librarian
      POSTGRES_PASSWORD: 17283940
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - library-network

  nginx:
    image: nginx:1.29.3
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./app/staticfiles:/app/staticfiles:ro
    depends_on:
      - web
    networks:
      - library-network

  web:
    build: .
    container_name: server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://librarian:17283940@db:5432/library_db
    networks:
      - library-network
    volumes:
      - ./app/staticfiles:/app/staticfiles

volumes:
  postgres_data:

networks:
  library-network:
    driver: bridge